<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art - Livoe Camera, Switch & Flashlight</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body {
            background-color: #050505;
            color: #fff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1;
            animation: float 10s infinite alternate ease-in-out;
        }
        body::before { width: 400px; height: 400px; background: rgba(0, 243, 255, 0.2); top: -100px; left: -100px; }
        body::after { width: 500px; height: 500px; background: rgba(255, 0, 128, 0.15); bottom: -150px; right: -100px; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }

        .app-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
            max-width: 1300px; width: 100%;
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.02);
            z-index: 1;
        }

        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; padding: 20px; border-radius: 24px; }
        }

        .header { margin-bottom: 25px; text-align: center; }
        .header h1 {
            font-size: 28px; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(90deg, #00f3ff, #ff00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            margin-bottom: 5px;
        }
        .header p { font-size: 11px; font-weight: 300; letter-spacing: 3px; color: #aaa; text-transform: uppercase; }

        .control-group {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: transform 0.3s, border 0.3s;
        }
        .control-group:hover { border: 1px solid rgba(0, 243, 255, 0.3); transform: translateY(-2px); }
        .control-group label.title {
            display: flex; justify-content: space-between; font-size: 12px;
            font-weight: 600; color: #00f3ff; text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        input[type="file"] { display: none; }
        
        .custom-upload-btn, .action-sub-btn {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 12px; gap: 10px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px dashed rgba(0, 243, 255, 0.5);
            border-radius: 12px; cursor: pointer; color: #ddd;
            font-size: 13px; font-weight: 600; transition: all 0.3s ease;
            text-align: center; word-break: break-all; margin-bottom: 10px;
        }
        .custom-upload-btn:hover, .action-sub-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: #00f3ff; color: #fff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn-live-cam {
            background: linear-gradient(45deg, #00f3ff22, #ff00ff22);
            border: 1px solid #ff00ff;
            color: #ff88ff;
        }
        .btn-live-cam.active {
            background: linear-gradient(45deg, #ff0055, #ff0033);
            border-color: #ff0055;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
        }

        /* Tombol Tambahan Saat Kamera Nyala */
        .camera-tools {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn-switch-cam {
            background: linear-gradient(45deg, #0088ff22, #00f3ff22);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            margin-bottom: 0;
        }

        .btn-flash {
            background: linear-gradient(45deg, #ffaa0022, #ffea0022);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            margin-bottom: 0;
        }
        .btn-flash.active {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.6);
        }

        .file-icon { font-size: 18px; }

        select, input[type=text] {
            width: 100%; padding: 12px; border-radius: 10px;
            background: rgba(0, 0, 0, 0.5); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px; outline: none; appearance: none;
            cursor: pointer; transition: 0.3s;
        }
        select:focus, input[type=text]:focus { border-color: #ff00ff; box-shadow: 0 0 10px rgba(255, 0, 255, 0.2); }
        input[type=text] { margin-top: 10px; display: none; font-family: monospace; letter-spacing: 3px; }

        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; margin-top: 5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 10px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: #00f3ff; margin-top: -6px;
            box-shadow: 0 0 15px #00f3ff, 0 0 5px #fff; transition: 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .color-picker-wrapper { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        input[type=color] {
            -webkit-appearance: none; width: 40px; height: 40px; border: none; border-radius: 50%;
            cursor: pointer; background: transparent; overflow: hidden;
        }
        input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type=color]::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        button.main-action {
            border: none; padding: 15px; border-radius: 14px;
            font-weight: 800; font-size: 14px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; overflow: hidden;
        }
        .btn-img {
            background: linear-gradient(45deg, #00f3ff, #0088ff); color: #fff;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.4);
        }
        .btn-img:hover { box-shadow: 0 8px 25px rgba(0, 243, 255, 0.7); transform: translateY(-3px); }
        
        .btn-vid {
            background: linear-gradient(45deg, #ff0055, #ff00ff); color: #fff;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }
        .btn-vid:hover { box-shadow: 0 8px 25px rgba(255, 0, 85, 0.7); transform: translateY(-3px); }

        .canvas-wrapper {
            position: relative; display: flex; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.6); border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }
        .canvas-container { width: 100%; max-width: 800px; aspect-ratio: 1 / 1; position: relative; }
        canvas { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
        
        #recordingIndicator {
            display: none; position: absolute; top: 20px; left: 20px;
            background: rgba(255, 0, 85, 0.9); color: white; padding: 8px 16px;
            border-radius: 30px; font-weight: 800; font-size: 13px; letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255,0,85,0.8); animation: blink 1s infinite; z-index: 10;
        }
        @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.95); } }
        video { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- PANEL KONTROL -->
        <div class="controls">
            <div class="header">
                <h1>ASCII NEON</h1>
                <p>Engine V9 // Flashlight Added</p>
            </div>

            <!-- SUMBER MEDIA -->
            <div class="control-group">
                <label class="title">Sumber Media</label>
                
                <!-- Tombol Kamera Live -->
                <button type="button" class="action-sub-btn btn-live-cam" id="toggleCamBtn">
                    <span class="file-icon">📷</span>
                    <span id="camBtnText">Nyalakan Real-Time Kamera</span>
                </button>

                <!-- Alat Tambahan Kamera (Switch & Flashlight) -->
                <div class="camera-tools" id="cameraTools">
                    <button type="button" class="action-sub-btn btn-switch-cam" id="switchCamBtn">
                        <span class="file-icon">🔄</span> <span>Putar</span>
                    </button>
                    <button type="button" class="action-sub-btn btn-flash" id="flashBtn">
                        <span class="file-icon">🔦</span> <span id="flashText">Senter</span>
                    </button>
                </div>

                <!-- Tombol Upload File Galeri -->
                <label for="mediaUpload" class="custom-upload-btn" id="lblMediaUpload">
                    <span class="file-icon">📁</span>
                    <span class="file-text">Atau Pilih File Galeri</span>
                </label>
                <input type="file" id="mediaUpload">
            </div>

            <!-- BACKGROUND -->
            <div class="control-group">
                <label class="title">Background Style</label>
                <label for="bgImageUpload" class="custom-upload-btn" id="lblBgUpload" style="margin-bottom: 12px; border-color: rgba(255,0,255,0.5);">
                    <span class="file-icon">🌌</span>
                    <span class="file-text">Upload Gambar Latar</span>
                </label>
                <input type="file" id="bgImageUpload">
                
                <div class="color-picker-wrapper">
                    <input type="color" id="bgColor" value="#050505">
                    <span style="font-size: 11px; color:#aaa; font-weight: 300;">Warna solid latar</span>
                </div>
            </div>

            <!-- ASCII TEXT -->
            <div class="control-group">
                <label class="title">ASCII Preset</label>
                <select id="asciiSelect">
                    <option value="standard">Standard ( .:-=+*#%@ )</option>
                    <option value="binary">Cyber Binary ( 01 )</option>
                    <option value="matrix">Matrix Tech ( +-=*#XO$& )</option>
                    <option value="blocks">Retro Blocks (  ░▒▓█ )</option>
                    <option value="letters">Alphabet ( A-Z )</option>
                    <option value="custom">✨ Custom Text</option>
                </select>
                <input type="text" id="customAsciiInput" value=" .`,:;+*?%S#@" placeholder="Ketik karakter (gelap > terang)">
            </div>

            <!-- RESOLUTION -->
            <div class="control-group">
                <label class="title">
                    Detail / Resolusi 
                    <span id="sizeValue" style="color: #fff;">10px</span>
                </label>
                <input type="range" id="dotSize" min="4" max="25" value="10">
            </div>

            <!-- SPEED -->
            <div class="control-group" id="speedGroup" style="display:none;">
                <label class="title">
                    Video Speed 
                    <span id="speedValue" style="color: #fff;">1.0x</span>
                </label>
                <input type="range" id="videoSpeed" min="0.1" max="3" step="0.1" value="1">
            </div>

            <!-- BUTTONS -->
            <div class="btn-group">
                <button id="saveImgBtn" class="main-action btn-img">💾 Save Img</button>
                <button id="recordVidBtn" class="main-action btn-vid">🔴 REC Video</button>
            </div>
        </div>

        <!-- CANVAS -->
        <div class="canvas-wrapper">
            <div class="canvas-container">
                <div id="recordingIndicator">● MEREKAM</div>
                <canvas id="asciiCanvas"></canvas>
            </div>
        </div>
    </div>

    <video id="sourceVideo" loop muted playsinline></video>

    <script>
        const mediaUpload = document.getElementById('mediaUpload');
        const lblMediaText = document.querySelector('#lblMediaUpload .file-text');
        const toggleCamBtn = document.getElementById('toggleCamBtn');
        const cameraTools = document.getElementById('cameraTools');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const flashBtn = document.getElementById('flashBtn');
        const flashText = document.getElementById('flashText');
        const camBtnText = document.getElementById('camBtnText');
        
        const bgImageUpload = document.getElementById('bgImageUpload');
        const lblBgText = document.querySelector('#lblBgUpload .file-text');
        const bgColorInput = document.getElementById('bgColor');
        
        const asciiSelect = document.getElementById('asciiSelect');
        const customAsciiInput = document.getElementById('customAsciiInput');
        
        const dotSizeInput = document.getElementById('dotSize');
        const sizeValue = document.getElementById('sizeValue');
        const speedGroup = document.getElementById('speedGroup');
        const videoSpeedInput = document.getElementById('videoSpeed');
        const speedValue = document.getElementById('speedValue');
        
        const saveImgBtn = document.getElementById('saveImgBtn');
        const recordVidBtn = document.getElementById('recordVidBtn');
        const recordingIndicator = document.getElementById('recordingIndicator');
        
        const canvas = document.getElementById('asciiCanvas');
        const ctx = canvas.getContext('2d');
        const sourceVideo = document.getElementById('sourceVideo');

        let currentSource = null;    
        let currentBgImg = null;     
        let isVideo = false;
        let isCameraActive = false;
        let useFrontCamera = true; 
        let isFlashOn = false;
        let animationFrameId;
        let cameraStream = null;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        const asciiPresets = {
            standard: ' .`,:;+*?%S#@',
            binary: ' 01',
            matrix: ' +-=*#XO$&',
            blocks: '  ░▒▓█',
            letters: ' ABCDEFGHIJKLMNOPQRSTUVWXYZ'
        };
        
        let currentAsciiChars = asciiPresets.standard;

        async function startCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: { 
                        facingMode: useFrontCamera ? 'user' : 'environment', 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 } 
                    }, 
                    audio: false 
                };

                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                sourceVideo.srcObject = cameraStream;
                sourceVideo.play();
                
                currentSource = sourceVideo;
                isVideo = true;
                isCameraActive = true;

                camBtnText.textContent = "Matikan Kamera Live";
                toggleCamBtn.classList.add('active');
                cameraTools.style.display = 'grid'; // Munculkan tombol putar & senter
                lblMediaText.textContent = useFrontCamera ? "Kamera Depan Aktif 🟢" : "Kamera Belakang Aktif 🟢";
                speedGroup.style.display = 'none';

                // Reset status senter saat ganti kamera
                isFlashOn = false;
                flashBtn.classList.remove('active');
                flashText.textContent = "Senter";

                renderLoop();
            } catch (err) {
                alert('Gagal mengakses kamera! Pastikan izin kamera aktif.');
                console.error(err);
            }
        }

        toggleCamBtn.addEventListener('click', async () => {
            if (!isCameraActive) {
                stopCameraAndFiles();
                useFrontCamera = true; 
                await startCamera();
            } else {
                stopCameraAndFiles();
                camBtnText.textContent = "Nyalakan Real-Time Kamera";
                toggleCamBtn.classList.remove('active');
                cameraTools.style.display = 'none'; 
                lblMediaText.textContent = "Atau Pilih File Galeri";
            }
        });

        switchCamBtn.addEventListener('click', async () => {
            if (!isCameraActive) return;
            useFrontCamera = !useFrontCamera; 
            await startCamera(); 
        });

        // --- KONTROL SENTER (FLASHLIGHT) ---
        flashBtn.addEventListener('click', async () => {
            if (!isCameraActive || !cameraStream) return;
            
            const track = cameraStream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};

            // Cek apakah hardware HP mendukung torch/senter
            if (!capabilities.torch) {
                alert('Maaf, perangkat atau browser Anda tidak mendukug kontrol senter via web.');
                return;
            }

            try {
                isFlashOn = !isFlashOn;
                await track.applyConstraints({
                    advanced: [{ torch: isFlashOn }]
                });

                if (isFlashOn) {
                    flashBtn.classList.add('active');
                    flashText.textContent = "Matikan";
                } else {
                    flashBtn.classList.remove('active');
                    flashText.textContent = "Senter";
                }
            } catch (err) {
                alert('Gagal menyalakan senter.');
                console.error(err);
            }
        });

        function stopCameraAndFiles() {
            cancelAnimationFrame(animationFrameId);
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            sourceVideo.pause();
            sourceVideo.srcObject = null;
            sourceVideo.src = "";
            isCameraActive = false;
            isFlashOn = false;
        }

        asciiSelect.addEventListener('change', (e) => {
            if(e.target.value === 'custom') {
                c
